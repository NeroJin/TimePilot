# 在函数入口注入钩子整体短路：弹"在线功能不可用"提示框，菜单保持可用。
# ==========================================================
# ==========================================================
# 在线功能拦截（两层）：
# 第一层（上游）：sub_820C6BC8 是通用状态机切换 Transition(this, target)。
#   它先对当前状态调虚表+12（exit，主菜单退场）再进入目标状态，所以只拦
#   在线 enter 会僵死在无菜单界面。此钩子（return=false）读客体内存判断
#   目标状态的虚表+60（enter 槽）是否为 0x820CBFD8，是则把 r4 改成 -1，
#   让原函数走"索引非法 → 空操作"分支，主菜单完全不受影响。
# 第二层（安全网）：sub_820CBFD8+4 短路在线状态 enter 本体（trace 日志
#   同步记录调用方地址，便于以后排查）。
# ==========================================================
[[entrypoint.midasm_hook]]
address = 0x820C6BC8
name = "TimePilot_OnlineTransitionHook"
registers = ["r3", "r4"]
return = false

[[entrypoint.midasm_hook]]
address = 0x820CBFDC
name = "TimePilot_OnlineFeatureHook"
registers = ["r3", "r4", "r12"]
return = true
